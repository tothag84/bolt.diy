<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lumière</title>
    <!--
      Single-Page-App fallback for GitHub Pages.
      Redirects deep links (e.g. /bolt.diy/g/slug) into the SPA so React Router
      can handle them. Based on rafgraph/spa-github-pages.
    -->
    <script>
      var pathSegmentsToKeep = 1; // keep the /bolt.diy/ project path segment
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
